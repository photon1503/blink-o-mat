name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example 2.0.0 or v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    env:
      DOTNET_CONFIGURATION: Release
      AVALONIA_PROJECT: src/Rejector.Avalonia/Rejector.Avalonia.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          input_version='${{ github.event.inputs.version }}'
          if [ -n "$input_version" ]; then
            version="${input_version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Rejector.CrossPlatform.slnx

      - name: Run core tests
        run: dotnet test tests/Rejector.Core.Tests/Rejector.Core.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore

      - name: Publish Avalonia Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish "$env:AVALONIA_PROJECT" `
            -c $env:DOTNET_CONFIGURATION `
            -r win-x64 `
            --self-contained true `
            -o "${{ github.workspace }}\artifacts\publish-win-x64" `
            /p:AssemblyName=Rejector `
            /p:Version=${{ steps.version.outputs.version }} `
            /p:AssemblyVersion=${{ steps.version.outputs.version }} `
            /p:FileVersion=${{ steps.version.outputs.version }} `
            /p:InformationalVersion=${{ steps.version.outputs.tag }}

      - name: Setup Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyAppPublishDir=${{ github.workspace }}\artifacts\publish-win-x64" `
            "${{ github.workspace }}\Rejector.iss"

      - name: Create Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\artifacts\publish-win-x64\*" `
            -DestinationPath "${{ github.workspace }}\artifacts\Rejector-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/build-macos-dmg.sh
          scripts/build-macos-dmg.sh \
            --version '${{ steps.version.outputs.version }}' \
            --rid osx-arm64 \
            --out-dir artifacts/macos

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rejector-${{ matrix.rid }}
          path: |
            artifacts/Rejector-Setup-*.exe
            artifacts/Rejector-*-win-x64.zip
            artifacts/macos/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          input_version='${{ github.event.inputs.version }}'
          if [ -n "$input_version" ]; then
            version="${input_version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rejector ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/**/*
