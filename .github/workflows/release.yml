name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example 2.0.0 or v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}

    env:
      DOTNET_CONFIGURATION: Release
      AVALONIA_PROJECT: src/Rejector.Avalonia/Rejector.Avalonia.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          input_version='${{ github.event.inputs.version }}'
          if [ -n "$input_version" ]; then
            version="${input_version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Rejector.CrossPlatform.slnx

      - name: Run core tests
        run: dotnet test tests/Rejector.Core.Tests/Rejector.Core.Tests.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore

      - name: Publish Avalonia Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish "$env:AVALONIA_PROJECT" `
            -c $env:DOTNET_CONFIGURATION `
            -r win-x64 `
            --self-contained true `
            -o "${{ github.workspace }}\artifacts\publish-win-x64" `
            /p:Version=${{ steps.version.outputs.version }} `
            /p:AssemblyVersion=${{ steps.version.outputs.version }} `
            /p:FileVersion=${{ steps.version.outputs.version }} `
            /p:InformationalVersion=${{ steps.version.outputs.tag }}

      - name: Setup Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyAppPublishDir=${{ github.workspace }}\artifacts\publish-win-x64" `
            "/O${{ github.workspace }}\artifacts" `
            "${{ github.workspace }}\Rejector.iss"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/build-macos-dmg.sh
          scripts/build-macos-dmg.sh \
            --version '${{ steps.version.outputs.version }}' \
            --rid osx-arm64 \
            --out-dir artifacts/macos

      - name: Build Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          publish_dir="artifacts/publish-linux-x64"
          archive="artifacts/Rejector-${{ steps.version.outputs.version }}-linux-x64.tar.gz"
          dotnet publish "$AVALONIA_PROJECT" \
            -c "$DOTNET_CONFIGURATION" \
            -r linux-x64 \
            --self-contained true \
            -o "$publish_dir" \
            /p:Version=${{ steps.version.outputs.version }} \
            /p:AssemblyVersion=${{ steps.version.outputs.version }} \
            /p:FileVersion=${{ steps.version.outputs.version }} \
            /p:InformationalVersion=${{ steps.version.outputs.tag }}
          tar -C "$publish_dir" -czf "$archive" .

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rejector-win-x64
          path: artifacts/Rejector-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rejector-osx-arm64
          path: artifacts/macos/Rejector-${{ steps.version.outputs.version }}-osx-arm64.dmg
          if-no-files-found: error

      - name: Upload Linux archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rejector-linux-x64
          path: artifacts/Rejector-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          input_version='${{ github.event.inputs.version }}'
          if [ -n "$input_version" ]; then
            version="${input_version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            case "$asset" in
              "Rejector-$VERSION-osx-arm64.dmg"|"Rejector-Setup-$VERSION.exe"|"Rejector-$VERSION-linux-x64.tar.gz")
                ;;
              Rejector-*)
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rejector ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/**/*
