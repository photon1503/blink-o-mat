name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example 1.0.21 or v1.0.21)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      DOTNET_CONFIGURATION: Release
      PROJECT_PATH: ${{ github.workspace }}\src\blink-o-mat.csproj
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish
      INSTALLER_DIR: ${{ github.workspace }}\installer
      INSTALLER_SCRIPT: ${{ github.workspace }}\Rejector.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($inputVersion)) {
            $version = $inputVersion -replace '^v', ''
            $tag = "v$version"
          }
          else {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Publish application
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c ${{ env.DOTNET_CONFIGURATION }}
          -o "${{ env.PUBLISH_DIR }}"
          /p:Version=${{ steps.version.outputs.version }}
          /p:AssemblyVersion=${{ steps.version.outputs.version }}
          /p:FileVersion=${{ steps.version.outputs.version }}
          /p:InformationalVersion=${{ steps.version.outputs.tag }}

      - name: Setup Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          $arguments = @(
            "/DMyAppVersion=${{ steps.version.outputs.version }}",
            "/DMyAppPublishDir=${{ env.PUBLISH_DIR }}",
            "${{ env.INSTALLER_SCRIPT }}"
          )

          & $iscc @arguments

      - name: Create portable zip
        shell: pwsh
        run: |
          $zipPath = Join-Path "${{ github.workspace }}\artifacts" "Rejector-${{ steps.version.outputs.version }}-win-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}\*" -DestinationPath $zipPath

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rejector ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ env.INSTALLER_DIR }}\Rejector-Setup-${{ steps.version.outputs.version }}.exe
            ${{ github.workspace }}\artifacts\Rejector-${{ steps.version.outputs.version }}-win-x64.zip